name: Build

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

          echo "===== settings.xml ====="
          cat ~/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.MAVEN_TOKEN }}

      - name: Verify Parent Resolution
        run: |
          cat pom.xml

      - name: Maven Verify
        run: |
          chmod +x mvnw
          ./mvnw clean verify -U
        env:
          GITHUB_TOKEN: ${{ secrets.MAVEN_TOKEN }}