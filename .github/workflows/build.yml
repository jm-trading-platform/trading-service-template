name: Build

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
              <servers>
                  <server>
                      <id>github</id>
                      <username>josetelopez</username>
                      <password>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</password>
                  </server>
              </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Give execute permissions
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean verify
