name: Build

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Check Secret
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "TOKEN VACIO"
            exit 1
          else
            echo "TOKEN INFORMADO"
          fi

      - name: Create Maven Settings
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Show Maven Settings
        run: |
          cat ~/.m2/settings.xml | sed 's/<password>.*<\/password>/<password>***<\/password>/'

      - name: Verify Parent Access
        run: |
          chmod +x mvnw

          ./mvnw dependency:get \
            -Dartifact=com.jmtrading:trading-parent:1.1.0 \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/jm-trading-platform/trading-parent \
            -U

      - name: Build
        run: |
          ./mvnw clean verify -U
