name: Build

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven Settings
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>

            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>

            <profiles>
              <profile>
                <id>github-packages</id>

                <repositories>

                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/jm-trading-platform/trading-parent</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>

                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </repository>

                </repositories>

                <pluginRepositories>

                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </pluginRepository>

                </pluginRepositories>

              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>

          </settings>
          EOF

      - name: Verify Parent Resolution
        run: |
          chmod +x mvnw
          ./mvnw dependency:get -Dartifact=com.jmtrading:trading-parent:1.1.0:pom -U

      - name: Build
        run: |
          ./mvnw clean verify -U
