spring:

  application:
    name: trading-service-template

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trading-group
    producer:
      backs: all


spring doc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO