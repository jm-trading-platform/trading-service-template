spring:
  datasource:
      url: jdbc:postgresql://localhost:5432/auth_db
      username: trading
      password: trading
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: false

  application:
    name: trading-service-template

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trading-group
    producer:
      acks: all


springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO